name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out the tested revision
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify toolchain
        run: |
          test "$(node -p 'process.versions.node')" = "$(cat .node-version)"
          test "$(npm --version)" = "10.9.8"
          node --version
          npm --version

      - name: Install locked dependencies
        id: install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check

      - name: Test
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test -- --reporter=default --reporter=junit --outputFile.junit=artifacts/ci/junit.xml

      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Check patch whitespace
        id: diff
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$DIFF_BASE" || "$DIFF_BASE" =~ ^0+$ ]]; then
            DIFF_BASE=$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          git diff --check "$DIFF_BASE" HEAD

      - name: Verify tracked files stayed unchanged
        id: clean
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: git diff --exit-code HEAD -- .

      - name: Record verification evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          GATE_RESULTS: ${{ toJSON(steps) }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, appendFileSync } from 'node:fs';
          const command = (file, args) => execFileSync(file, args, { encoding: 'utf8' }).trim();
          const steps = JSON.parse(process.env.GATE_RESULTS);
          const gates = Object.fromEntries(
            ['install', 'typecheck', 'lint', 'format', 'test', 'build', 'diff', 'clean']
              .map((id) => [id, steps[id]?.outcome ?? 'skipped']),
          );
          const evidence = {
            testedSha: command('git', ['rev-parse', 'HEAD']),
            testedTree: command('git', ['rev-parse', 'HEAD^{tree}']),
            pullRequestHeadSha: process.env.PR_HEAD_SHA || null,
            pullRequestBaseSha: process.env.PR_BASE_SHA || null,
            event: process.env.GITHUB_EVENT_NAME,
            runUrl: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version,
            npm: command('npm', ['--version']),
            gates,
          };
          mkdirSync('artifacts/ci', { recursive: true });
          writeFileSync('artifacts/ci/evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Quality gates\n\nTested commit: \`${evidence.testedSha}\`\n\n` +
            '| Gate | Outcome |\n| --- | --- |\n' +
            Object.entries(gates).map(([gate, outcome]) => `| ${gate} | ${outcome} |\n`).join('') +
            '\nForge lint and an installed Jira smoke test remain separate release checks.\n');
          NODE

      - name: Upload verification evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/ci/evidence.json
            artifacts/ci/junit.xml
          if-no-files-found: error
          retention-days: 14
