modules:
  jira:projectPage:
    - key: releaseproof-project-page
      resource: releaseproof-ui
      resolver:
        function: releaseproof-resolver
      title:
        i18n: app.title
      layout: blank
  function:
    - key: releaseproof-resolver
      handler: resolvers/index.handler
resources:
  - key: releaseproof-ui
    path: dist/frontend
    tunnel:
      port: 5173
translations:
  resources:
    - key: en-US
      path: locales/en-US.json
    - key: de-DE
      path: locales/de-DE.json
  fallback:
    default: en-US
permissions:
  scopes:
    - read:jira-work
    - storage:app
app:
  id: ari:cloud:ecosystem::app/f17896e0-dca4-4fe6-9414-104eb8f3e606
  runtime:
    name: nodejs24.x
    architecture: arm64
